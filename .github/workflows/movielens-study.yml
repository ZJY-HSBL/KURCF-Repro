name: MovieLens 100K multi-seed full-rating study

on:
  push:
    branches: [main]
    paths:
      - "src/kurcf/study.py"
      - "src/kurcf/core.py"
      - "src/kurcf/data.py"
      - "src/kurcf/evaluation.py"
      - "scripts/summarize_study.py"
      - ".github/workflows/movielens-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movielens-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    name: Full 100K seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download official GroupLens MovieLens 100K
        run: kurcf download --dataset ml-100k
      - name: Run full rating evaluation and matched ablations
        run: |
          kurcf study --dataset ml-100k --seed ${{ matrix.seed }} \
            --clusters 7 --neighbors 20 --alpha 0.3 \
            --rating-cases 0 --ranking-users 100 --top-k 10 \
            --alpha-grid 0 0.3 0.6 1.0 \
            --cluster-grid 4 7 10 \
            --output results/seed-${{ matrix.seed }}.json
      - name: Upload independently measured seed JSON
        uses: actions/upload-artifact@v4
        with:
          name: study-seed-${{ matrix.seed }}
          path: results/seed-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate real runs and publish study figures
    needs: study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all five measured run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: study-seed-*
          merge-multiple: true
          path: benchmarks/study/runs
      - name: Compute paired summaries and regenerate SVG charts
        run: |
          python scripts/summarize_study.py --min-seeds 5
          python scripts/summarize_study.py --min-seeds 5 --check
      - name: Commit original observations and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/study/ assets/figures/ml100k-study-*.svg
          if git diff --cached --quiet; then
            echo "Study outputs unchanged."
          else
            git commit -m "benchmarks: publish five-seed full MovieLens 100K ablations"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
