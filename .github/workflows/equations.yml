name: Generate README math SVGs

on:
  push:
    branches: [main]
    paths:
      - "assets/equations/formulas.json"
      - "scripts/render_equations.cjs"
      - ".github/workflows/equations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned MathJax renderer
        run: npm install --no-save --no-package-lock mathjax-full@3.2.2
      - name: Render equation SVGs
        run: node scripts/render_equations.cjs
      - name: Check XML validity and both README image links
        run: python3 scripts/validate_equations.py
      - name: Commit generated SVG assets
        run: |
          git add assets/equations/*.svg
          if git diff --cached --quiet; then
            echo "No SVG changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: render mobile-compatible mathematical equations"
            git push origin HEAD:main
          fi
