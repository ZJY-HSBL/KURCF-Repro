name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: CLI help
        run: |
          kurcf --help
          kurcf study --help
          kurcf nested --help
          python scripts/summarize_nested.py --help

  figures:
    name: Verify reproducible SVG figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate figures from benchmark JSON
        run: node scripts/render_figures.mjs
      - name: Install pinned MathJax renderer
        run: npm install --no-save --no-package-lock mathjax-full@3.2.2
      - name: Regenerate math SVGs from LaTeX
        run: node scripts/render_equations.cjs
      - name: Check formula SVG integrity and README references
        run: python3 scripts/validate_equations.py
      - name: Ensure committed figures match source JSON and LaTeX
        run: git diff --exit-code -- assets/figures/ assets/equations/*.svg
      - name: Check full-rating study artifacts if available
        run: |
          if [ -f benchmarks/study/runs/seed-0.json ]; then
            python3 scripts/summarize_study.py --min-seeds 5 --check
          fi
          if [ -f benchmarks/nested/runs/seed-0.json ]; then
            python3 scripts/summarize_nested.py --min-seeds 5 --check
          fi

  release:
    name: Build and release
    needs: [test, figures]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish first release for version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; skipping."
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG - independent KUR-CF reproduction" --generate-notes
          fi
