name: MovieLens 100K nested-validation full-ranking study

on:
  push:
    branches: [main]
    paths:
      - "src/kurcf/nested.py"
      - "src/kurcf/core.py"
      - "src/kurcf/data.py"
      - "src/kurcf/evaluation.py"
      - "scripts/summarize_nested.py"
      - ".github/workflows/movielens-nested.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movielens-nested-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nested:
    name: Nested outer-test seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download official GroupLens MovieLens 100K
        run: kurcf download --dataset ml-100k
      - name: Select on inner validation and evaluate full outer test
        run: |
          kurcf nested --dataset ml-100k --seed ${{ matrix.seed }} \
            --fixed-clusters 7 --fixed-alpha 0.3 --neighbors 20 \
            --test-ratio 0.2 --validation-ratio 0.2 \
            --ranking-users 0 --top-k 10 \
            --alpha-grid 0 0.3 0.6 1.0 --cluster-grid 4 7 10 \
            --output results/seed-${{ matrix.seed }}.json
      - name: Upload original independent seed result
        uses: actions/upload-artifact@v4
        with:
          name: nested-seed-${{ matrix.seed }}
          path: results/seed-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Validate and publish nested-study results
    needs: nested
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect five independent measured JSON files
        uses: actions/download-artifact@v4
        with:
          pattern: nested-seed-*
          merge-multiple: true
          path: benchmarks/nested/runs
      - name: Verify protocols and build charts from raw data
        run: |
          python scripts/summarize_nested.py --min-seeds 5
          python scripts/summarize_nested.py --min-seeds 5 --check
      - name: Commit raw observations and deterministic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/nested/ assets/figures/ml100k-nested-*.svg
          if git diff --cached --quiet; then
            echo "Results are unchanged."
          else
            git commit -m "benchmarks: archive five-seed nested validation and full ranking"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
