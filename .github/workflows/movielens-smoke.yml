name: MovieLens 100K smoke benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/movielens-smoke.yml"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Download official MovieLens 100K
        run: kurcf download --dataset ml-100k
      - name: Real-data smoke run (small disclosed evaluation samples)
        run: |
          kurcf benchmark --dataset ml-100k --models kurcf usercf cluster-pearson \
            --seed 42 --clusters 7 --neighbors 20 --alpha 0.3 \
            --rating-cases 120 --ranking-users 12 --top-k 10 \
            --output results/ml100k-smoke.json
      - name: Upload reproducible JSON metrics
        uses: actions/upload-artifact@v4
        with:
          name: ml100k-smoke-results
          path: results/ml100k-smoke.json
